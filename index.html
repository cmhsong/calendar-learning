<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>달력 배우기 — 하루·일주일·한 달·1년과 달력 보기</title>
<meta name="description" content="하루, 일주일, 한 달, 1년의 뜻을 배우고 달력 보는 법을 익히는 쉬운 학습지입니다. 문제가 매번 바뀌는 A4 학습지를 인쇄할 수 있습니다.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='%235B4BFF'/%3E%3Crect x='20' y='30' width='60' height='50' rx='8' fill='%23fff'/%3E%3Crect x='20' y='30' width='60' height='14' rx='6' fill='%23C9C2FF'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <header class="top">
    <div class="top-in">
      <button type="button" class="brand" data-act="home" aria-label="처음 화면으로">
        <span class="logo" id="logo" aria-hidden="true"></span><span>달력 배우기</span>
      </button>
      <div class="tools" role="toolbar" aria-label="화면 설정">
        <div class="seg" role="group" aria-label="글자 크기">
          <span>글자</span>
          <button type="button" data-act="fs-" aria-label="글자 작게">−</button>
          <output id="fsVal">100%</output>
          <button type="button" data-act="fs+" aria-label="글자 크게">+</button>
        </div>
        <div class="seg" role="group" aria-label="화면 비율">
          <span>화면</span>
          <button type="button" data-act="zm-" aria-label="화면 작게">−</button>
          <output id="zmVal">100%</output>
          <button type="button" data-act="zm+" aria-label="화면 크게">+</button>
        </div>
        <button type="button" class="tool" data-act="reset">처음 크기</button>
        <button type="button" class="tool" id="sndBtn" data-act="sound" aria-pressed="true">소리 켬</button>
      </div>
    </div>
  </header>
  <nav class="tabs" id="tabs" aria-label="배울 내용"></nav>

  <main id="main" tabindex="-1"></main>

  <footer class="foot">
    <p>오픈 소스: <a href="https://github.com/catdad/canvas-confetti" target="_blank" rel="noopener">canvas-confetti</a> · <a href="https://github.com/orioncactus/pretendard" target="_blank" rel="noopener">Pretendard</a> · 공휴일 <a href="https://github.com/hyunbinseo/holidays-kr" target="_blank" rel="noopener">holidays-kr</a> 무료 공개 API</p>
  </footer>
</div>

<dialog id="monthDlg" aria-label="달력 넘겨 보기">
  <div class="md">
    <div id="monthDlgBody"></div>
    <form method="dialog"><button type="submit" class="btn dark">닫기</button></form>
  </div>
</dialog>

<script src="vendor/confetti.browser.min.js"></script>
<script src="app.js"></script>
</body>
</html>
