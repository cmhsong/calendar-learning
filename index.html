<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>달력 배우기 — 일·월·주·년과 달력 보기</title>
<meta name="description" content="하루, 한 달, 일주일, 1년의 뜻을 배우고 달력 보는 법을 익히는 쉬운 학습지입니다. A4 학습지로 인쇄할 수 있습니다.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%93%85%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <header class="top">
    <button type="button" class="brand" data-act="home" aria-label="처음 화면으로">
      <span class="brand-ico" aria-hidden="true">📅</span><span>달력 배우기</span>
    </button>
    <div class="tools" role="toolbar" aria-label="화면 설정">
      <div class="tg" role="group" aria-label="글자 크기">
        <span class="tg-l">글자</span>
        <button type="button" data-act="fs-" aria-label="글자 작게">가<sub>−</sub></button>
        <output id="fsVal">100%</output>
        <button type="button" data-act="fs+" aria-label="글자 크게"><b>가</b><sub>+</sub></button>
      </div>
      <div class="tg" role="group" aria-label="화면 비율">
        <span class="tg-l">화면</span>
        <button type="button" data-act="zm-" aria-label="화면 작게">−</button>
        <output id="zmVal">100%</output>
        <button type="button" data-act="zm+" aria-label="화면 크게">+</button>
      </div>
      <button type="button" class="tbtn" data-act="reset" aria-label="글자와 화면을 처음 크기로">처음 크기</button>
      <button type="button" class="tbtn" id="sndBtn" data-act="sound" aria-pressed="true">🔊 소리 켬</button>
      <button type="button" class="tbtn print" data-act="print-open">🖨 학습지 인쇄</button>
    </div>
  </header>

  <main id="main" tabindex="-1"></main>

  <footer class="foot">
    <p>오픈 소스 사용: <a href="https://github.com/catdad/canvas-confetti" target="_blank" rel="noopener">canvas-confetti</a> (ISC) · <a href="https://github.com/orioncactus/pretendard" target="_blank" rel="noopener">Pretendard</a> 글꼴 (OFL)</p>
  </footer>
</div>

<dialog id="printDlg" aria-labelledby="pdTitle">
  <form method="dialog" class="pd">
    <h2 id="pdTitle">🖨 A4 학습지 인쇄</h2>
    <fieldset>
      <legend>어느 단원을 인쇄할까요?</legend>
      <div class="pd-units" id="pdUnits"></div>
    </fieldset>
    <fieldset>
      <legend>무엇을 넣을까요?</legend>
      <label class="ck"><input type="checkbox" id="pdLearn" checked> 배워요 (개념 정리)</label>
      <label class="ck"><input type="checkbox" id="pdQuiz" checked> 풀어요 (문제)</label>
      <label class="ck"><input type="checkbox" id="pdKey"> 정답지 (교사용)</label>
      <label class="ck"><input type="checkbox" id="pdBig"> 큰 글씨로 인쇄</label>
    </fieldset>
    <p class="pd-tip">인쇄 창에서 용지는 <b>A4</b>, 배율은 <b>100%</b>, ‘배경 그래픽’을 켜면 가장 예쁘게 나옵니다. 대상을 ‘PDF로 저장’으로 바꾸면 파일로 저장됩니다.</p>
    <div class="pd-btns">
      <button type="submit" value="cancel" class="btn ghost">닫기</button>
      <button type="submit" value="print" class="btn primary">인쇄하기</button>
    </div>
  </form>
</dialog>

<div id="print-root" aria-hidden="true"></div>

<script src="vendor/confetti.browser.min.js"></script>
<script src="app.js"></script>
</body>
</html>
